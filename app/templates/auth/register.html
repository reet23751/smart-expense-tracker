{% extends "base.html" %}

{% block title %}Sign Up - Smart Expense Tracker & AI Advisor{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 py-4">
  <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
    <div class="card card-modern border-0 shadow-lg p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.5rem;">
          <i class="bi bi-wallet2"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">Create Account</h3>
        <p class="text-muted small">Start tracking your income, expenses & budgets today.</p>
      </div>

      <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="mb-3">
          <label class="form-label small text-muted fw-bold">FULL NAME</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control border-start-0" name="name" value="{{ name or '' }}" placeholder="John Doe" required autocomplete="name">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small text-muted fw-bold">EMAIL ADDRESS</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control border-start-0" name="email" value="{{ email or '' }}" placeholder="john@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small text-muted fw-bold">PASSWORD</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control border-start-0" name="password" placeholder="At least 6 characters" required autocomplete="new-password">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small text-muted fw-bold">CONFIRM PASSWORD</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-shield-check"></i></span>
            <input type="password" class="form-control border-start-0" name="confirm_password" placeholder="Repeat password" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 fw-bold">
          Create Free Account
        </button>
      </form>

      <div class="text-center mt-4 pt-2 border-top">
        <span class="text-muted small">Already have an account?</span>
        <a href="{{ url_for('auth.login') }}" class="fw-bold text-primary small text-decoration-none ms-1">Sign In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Sign In - Smart Expense Tracker & AI Advisor{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 py-4">
  <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
    <div class="card card-modern border-0 shadow-lg p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.5rem;">
          <i class="bi bi-wallet2"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">Welcome back</h3>
        <p class="text-muted small">Manage your spending and get AI-powered financial advice.</p>
      </div>

      <!-- Quick Demo Access Banner -->
      <div class="p-3 mb-4 rounded-3 text-center" style="background: linear-gradient(135deg, rgba(79, 70, 229, 0.08), rgba(124, 58, 237, 0.12)); border: 1px dashed rgba(79, 70, 229, 0.3);">
        <div class="small fw-semibold text-primary mb-2">
          <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Portfolio Demo
        </div>
        <a href="{{ url_for('auth.demo_login') }}" class="btn btn-sm btn-outline-primary rounded-pill px-3 fw-bold w-100">
          Sign In as Demo User (1-Click)
        </a>
      </div>

      <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="mb-3">
          <label class="form-label small text-muted fw-bold">EMAIL ADDRESS</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control border-start-0" name="email" value="{{ email or '' }}" placeholder="alex@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small text-muted fw-bold">PASSWORD</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control border-start-0" name="password" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="remember" id="rememberMe">
            <label class="form-check-label small text-muted" for="rememberMe">
              Remember me
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 fw-bold">
          Sign In
        </button>
      </form>

      <div class="text-center mt-4 pt-2 border-top">
        <span class="text-muted small">Don't have an account?</span>
        <a href="{{ url_for('auth.register') }}" class="fw-bold text-primary small text-decoration-none ms-1">Create one</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
